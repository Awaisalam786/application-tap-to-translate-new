name: tap_to_translate
description: "A production-grade German PDF Reader and Tap-to-Translate application for Android and iOS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # PDF Engine (LOCKED: pdfrx 2.6.5)
  pdfrx: ^2.6.5

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing and Navigation
  go_router: ^14.2.0

  # Storage and Utilities
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  file_picker: ^8.0.5

  # UI Icons
  cupertino_icons: ^1.0.8

  # OCR Vision (Google ML Kit on-device)
  google_mlkit_text_recognition: ^0.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
